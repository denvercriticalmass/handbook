name: dcm-handbook

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: handbook
      POSTGRES_PASSWORD: handbook
      POSTGRES_DB: handbook_development
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username handbook --dbname handbook_development"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres:
