# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-rspec
  - rubocop-rspec_rails

require:
  - ./.rubocop/cops/empty_action_method.rb
  - ./.rubocop/cops/it_block_parameter.rb
  - ./.rubocop/cops/prefer_data.rb

Handbook/EmptyActionMethod:
  Description: "Empty controller actions carry no information."
  Enabled: true
  Include:
    - app/controllers/**/*.rb

AllCops:
  NewCops: enable
  Exclude:
    # Migrations copied in from an engine, so ours to run but not to restyle.
    # Engine copies carry the engine name: create_versions.paper_trail.rb.
    - db/migrate/*.*.rb

# Omakase allows either. Prefer the shorthand when the key and the local share
# a name.
Style/HashSyntax:
  EnforcedShorthandSyntax: always

# Omakase leaves line length alone. 120 is the hard limit; the editor rulers
# in .editorconfig and .vscode/settings.json mark 80 as the comfortable one.
Layout/LineLength:
  Enabled: true
  Max: 120
  Exclude:
    - db/*_schema.rb

Handbook/ItBlockParameter:
  Description: "Prefer `it` over a named block parameter for one-line bodies."
  Enabled: true
  Exclude:
    # RSpec generated this file and names its parameters `expectations` and
    # `mocks`, which say more than `it` does.
    - spec/spec_helper.rb

# System specs are journeys; the short-example limits don't fit them.
# System specs are journeys and cop specs are mostly heredocs; the
# short-example limits don't fit either.
RSpec/ExampleLength:
  Exclude:
    - spec/system/**/*.rb
    - spec/rubocop/**/*.rb

RSpec/MultipleExpectations:
  Exclude:
    - spec/system/**/*.rb
    - spec/rubocop/**/*.rb

# A yaml file has no class to name.
RSpec/DescribeClass:
  Exclude:
    - spec/config/**/*.rb

Handbook/PreferData:
  Description: "Prefer Data.define over Struct.new or a frozen record hash."
  Enabled: true

# Both need TargetRubyVersion >= 3.2, which .ruby-version supplies. Omakase
# leaves them off.
Style/DataInheritance:
  Enabled: true

Style/StructInheritance:
  Enabled: true
