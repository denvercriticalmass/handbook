test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# A separate bucket from the backups, whose retention sweep deletes anything
# older than thirty days.
uploads:
  service: S3
  access_key_id: <%= Rails.application.credentials.dig(:uploads, :access_key_id) %>
  secret_access_key: <%= Rails.application.credentials.dig(:uploads, :secret_access_key) %>
  endpoint: <%= Rails.application.credentials.dig(:uploads, :endpoint) %>
  region: <%= Rails.application.credentials.dig(:uploads, :region) %>
  bucket: <%= Rails.application.credentials.dig(:uploads, :bucket) %>
